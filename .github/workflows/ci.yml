name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./bizpulse
      run: npm install

    - name: Run linter
      working-directory: ./bizpulse
      run: npm run lint

    - name: Build Next.js app
      working-directory: ./bizpulse
      run: npm run build
